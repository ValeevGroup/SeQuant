name: Formatting check

on: [push, pull_request]

jobs:
  check:
    name: "Check formatting"
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format-17
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/llvm.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-17 main" | sudo tee /etc/apt/sources.list.d/llvm-17.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-format-17

      - name: Run clang-format check
        run: |
          find . -path ./SeQuant/external -prune -o \
            -regextype posix-extended \
            -regex '.*\.(h|hpp|hh|hxx|ipp|cpp|cc|cxx)$' \
            -print0 | \
          xargs -0 clang-format-17 --dry-run --Werror

      - name: Forbid SeQuant/core/export from including eval's runtime execution headers
        run: |
          # SeQuant/core/export may depend on eval's pure scheduling data
          # (cell_table.hpp, ordered_schedule.hpp, ...) but never on its
          # runtime execution machinery (cell_registry.hpp,
          # ordered_executor.hpp), which has no meaning for a one-shot
          # compile. See the export-as-eval-backend migration design notes.
          if grep -rlE '#\s*include\s*[<"][^>"]*\b(cell_registry|ordered_executor)\.hpp[>"]' SeQuant/core/export; then
            echo "::error::SeQuant/core/export must not include eval's runtime execution headers (cell_registry.hpp, ordered_executor.hpp) — see above for offending file(s)."
            exit 1
          fi
