name: CI Build

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master'}} # don't cancel jobs on master

#env:

jobs:
  build:
    # The sanitizer configuration is the long pole and it has outgrown 60
    # minutes: its last green run spent 28.2 min building and 28.9 min in
    # ctest, finishing at 59.9 min. 25 of those 28.9 test minutes are eight
    # long-standing cases (sequant/unit/mbpt_cc alone is 10 min under ASan)
    # plus the integration suite, so the cap is not a symptom of any one
    # change and trimming tests further buys almost nothing. Give every
    # configuration headroom instead of losing runs to a 6-second margin.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build_type : [ Release, Debug ]
        os : [ macos-26, ubuntu-26.04, windows-2025 ]
        valgrind: [ true, false ]
        sanitize: [ true, false ]
        # where Boost comes from: the system package manager (vcpkg on Windows), or built from source by SeQuant
        boost: [ system ]
        exclude:
          - valgrind : true
            sanitize : true
          - build_type : Release
            valgrind : true
          - build_type : Release
            sanitize : true
          - os: macos-26
            sanitize: true
          - os: macos-26
            valgrind: true
          - os: windows-2025
            sanitize: true
          - os: windows-2025
            valgrind: true
        include:
          # MSVC needs Boost >= 1.85 (Spirit); check that the Boost SeQuant builds from source works with it
          - os: windows-2025
            build_type: Release
            valgrind: false
            sanitize: false
            boost: fetch
          - os: ubuntu-26.04
            cxx: /usr/bin/g++-14
            sanitize_flags: -fsanitize=address -fsanitize=leak -fsanitize=undefined -fno-omit-frame-pointer -fno-var-tracking
            hardening_flags: -D_GLIBCXX_ASSERTIONS
          - os: macos-26
            cxx: clang++
            sanitize_flags: -fsanitize=address -fsanitize=undefined -fno-omit-frame-pointer -fno-var-tracking
            hardening_flags: -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE
          - os: windows-2025
            hardening_flags: -D_MSVC_STL_HARDENING=1

    name: "${{ matrix.valgrind && 'Valgrind' || matrix.sanitize && 'Sanitizers' || '' }} ${{ matrix.os }}: ${{ matrix.cxx }} ${{ matrix.build_type }}${{ matrix.boost == 'fetch' && ' (Boost built from source)' || '' }}"
    runs-on: ${{ matrix.os }}
    env:
      CXX : ${{ matrix.cxx }}
      DOXYGEN_VERSION : 1.9.1
      CCACHE_DIR : ${{github.workspace}}/build/.ccache
      CCACHE_COMPRESS : true
      CCACHE_COMPRESSLEVEL : 6
      BUILD_CONFIG : >
        -G Ninja
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_SHARED_LIBS=OFF
        -DCMAKE_UNITY_BUILD=${{ !matrix.sanitize && (matrix.build_type == 'Debug' || matrix.valgrind) }}
        -DMPIEXEC_PREFLAGS='--bind-to;none;--allow-run-as-root'
        -DCMAKE_PREFIX_PATH='/usr/local/opt/boost'
        -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install
        -DSEQUANT_TESTS=ON
        -DSEQUANT_EVAL_TESTS=${{ !matrix.valgrind && !matrix.sanitize && !startswith(matrix.os, 'windows') }}
        -DSEQUANT_USE_SYSTEM_BOOST_HASH=OFF
        -DCMAKE_CXX_STANDARD=${{ matrix.build_type == 'Release' && 23 || 20 }}
        -DCMAKE_CXX_EXTENSIONS=OFF
        -DSEQUANT_BENCHMARKS=${{ !matrix.valgrind && !matrix.sanitize }}
        -DSEQUANT_SKIP_LONG_TESTS=${{ matrix.valgrind || matrix.sanitize }}
        -DSEQUANT_COMPILE_DOC_EXAMPLES=${{ !matrix.valgrind }}
        -DSEQUANT_PYTHON=${{ matrix.build_type == 'Release' }}
        -DSEQUANT_ASSERT_BEHAVIOR=${{ matrix.valgrind && 'IGNORE' || matrix.build_type == 'Debug' && 'ABORT' || 'THROW' }}
    steps:
    - uses: actions/checkout@v7

    - name: free up disk space on Ubuntu runner
      if: ${{ startswith(matrix.os, 'ubuntu') }}
      uses: jlumbroso/free-disk-space@main

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install Python packages
      run: pip install --index-url https://download.pytorch.org/whl/cpu numpy torch

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Set sanitizer flags
      if: ${{ matrix.sanitize }}
      shell: bash
      run: |
        if [[ '${{ matrix.sanitize }}' = 'true' ]]; then
          echo "CXXFLAGS=${{ matrix.sanitize_flags }}" >> "$GITHUB_ENV"
        fi

    # Release jobs are the only ones that run the long test cases (Debug skips
    # them, and the sanitizer and valgrind jobs are Debug), so give them the
    # standard library's precondition checks. Unlike the debug modes
    # (_GLIBCXX_DEBUG, _ITERATOR_DEBUG_LEVEL=2) these keep the ABI, so the
    # prebuilt dependencies still link.
    - name: Set standard library hardening flags
      if: ${{ matrix.build_type == 'Release' }}
      shell: bash
      run: echo "CXXFLAGS=${{ matrix.hardening_flags }}" >> "$GITHUB_ENV"

    - name: Install prerequisite MacOS packages
      if: ${{ startswith(matrix.os, 'macos') }}
      run: brew install boost eigen open-mpi ccache catch2 google-benchmark

    - name: Install prerequisites Ubuntu packages
      if: ${{ startswith(matrix.os, 'ubuntu') }}
      run: |
        sudo apt-get update
        sudo apt-get install ninja-build g++-14 liblapack-dev libboost-dev libboost-locale-dev libboost-random-dev libboost-regex-dev libeigen3-dev openmpi-bin libopenmpi-dev ccache valgrind catch2 libbenchmark-dev

    - name: Enable TBB
      if: ${{ startswith(matrix.os, 'ubuntu') && !matrix.valgrind && !matrix.sanitize }}
      run: |
        sudo apt-get install libtbb-dev
        echo "TBB_CONFIG=-DENABLE_TBB=ON" >> "$GITHUB_ENV"

    - name: Setup MSVC
      if: ${{ startswith(matrix.os, 'windows') }}
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Install ccache on Windows
      if: ${{ startswith(matrix.os, 'windows') }}
      run: choco install ccache -y --no-progress

    - name: Install prerequisites Windows packages
      if: ${{ startswith(matrix.os, 'windows') }}
      id: vcpkg
      uses: johnwason/vcpkg-action@v8
      with:
        pkgs: >-
          eigen3 catch2 benchmark
          ${{ matrix.boost == 'system' && 'boost-container boost-container-hash boost-conversion boost-core boost-dynamic-bitset boost-fusion boost-hana boost-interval boost-locale boost-multiprecision boost-numeric-conversion boost-random boost-range boost-regex boost-spirit boost-unordered boost-variant' || '' }}
        triplet: x64-windows
        token: ${{ github.token }}

    - name: Prepare ccache timestamp
      id: ccache_cache_timestamp
      shell: bash
      run: echo "timestamp=$(date -u +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT

    - name: Restore ccache cache files
      id: ccache_restore
      uses: actions/cache/restore@v6
      with:
        path: ${{github.workspace}}/build/.ccache
        key: ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.sanitize }}-${{ matrix.valgrind }}-${{ matrix.boost }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
        restore-keys: |
          ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.sanitize }}-${{ matrix.valgrind }}-${{ matrix.boost }}-ccache-

    - name: Configure CMake
      shell: bash
      # Passed through the environment so that bash does not interpret the backslashes in Windows paths
      env:
        VCPKG_CMAKE_CONFIG: ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}
      run: cmake -DCMAKE_BUILD_TYPE=$BUILD_TYPE $BUILD_CONFIG -B $GITHUB_WORKSPACE/build -S $GITHUB_WORKSPACE -DSEQUANT_QUICK_BENCHMARKS=ON $TBB_CONFIG $VCPKG_CMAKE_CONFIG


    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: ccache -p && ccache -z && cmake --build . -j 2 && ccache -s

    - name: Save ccache cache files
      if: ${{ github.ref == 'refs/heads/master' }}
      uses: actions/cache/save@v6
      with:
        path: ${{github.workspace}}/build/.ccache
        key: ${{ steps.ccache_restore.outputs.cache-primary-key }}

    - name: Test
      if: ${{ !matrix.valgrind }}
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: ctest --output-on-failure -R "^sequant"

    - name: Test consuming installed SeQuant
      if: ${{ !matrix.valgrind && !matrix.sanitize }}
      shell: bash
      env:
        VCPKG_CMAKE_CONFIG: ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}
      run: |
        cmake --install build
        cmake -S tests/consumer -B $RUNNER_TEMP/consumer -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install;/usr/local/opt/boost" $VCPKG_CMAKE_CONFIG
        cmake --build $RUNNER_TEMP/consumer
        $RUNNER_TEMP/consumer/consumer

        # the install refuses to overwrite a different version of a package it installed (libPerm is never found, so always fetched)
        version_file=$(find "$GITHUB_WORKSPACE/install" -name libperm-config-version.cmake)
        test -n "$version_file"
        sed -i.bak 's/^set(PACKAGE_VERSION "[^"]*")/set(PACKAGE_VERSION "0.0.1")/' "$version_file"
        if cmake --install build; then echo "the install should have refused to overwrite libperm 0.0.1"; exit 1; fi
        mv "$version_file.bak" "$version_file"

        # with the master switch off nothing fetched is installed; the consumer then gets the dependencies from the first install
        cmake -DSEQUANT_INSTALL_FETCHED_DEPENDENCIES=OFF -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install-nodeps build
        cmake --install build
        test ! -e "$GITHUB_WORKSPACE/install-nodeps/lib/cmake/range-v3"
        cmake -S tests/consumer -B $RUNNER_TEMP/consumer-nodeps -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install-nodeps;$GITHUB_WORKSPACE/install;/usr/local/opt/boost" $VCPKG_CMAKE_CONFIG
        cmake --build $RUNNER_TEMP/consumer-nodeps
        $RUNNER_TEMP/consumer-nodeps/consumer

    - name: Test consuming installed SeQuant with a fetched backend
      # TAPP is the cheapest fetched backend: built already, small to install
      if: ${{ !matrix.valgrind && !matrix.sanitize && !startswith(matrix.os, 'windows') }}
      shell: bash
      run: |
        cmake -DSEQUANT_INSTALL_FETCHED_DEPENDENCIES=ON -DSEQUANT_INSTALL_FETCHED_BACKENDS=TAPP -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install-tapp build
        cmake --build build -j 2
        cmake --install build
        cmake -S tests/consumer -B $RUNNER_TEMP/consumer-tapp -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install-tapp;/usr/local/opt/boost" -DSEQUANT_CONSUMER_BACKENDS=tapp
        cmake --build $RUNNER_TEMP/consumer-tapp
        $RUNNER_TEMP/consumer-tapp/consumer

    - name: Ensure benchmarks not broken
      if: ${{ !matrix.valgrind && !matrix.sanitize }}
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: ./benchmarks/sequant_benchmarks --benchmark_dry_run=true

    - name: Test (+ Valgrind)
      if: ${{ matrix.valgrind }}
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: valgrind --error-exitcode=1 --leak-check=full ./tests/unit/unit_tests-sequant '~[valgrind_skip]'
